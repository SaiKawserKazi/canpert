[project]
name = "canpert"
version = "0.1.0"
description = "CanPert: how cell line context reshapes CRISPRi Perturb-seq responses; CASTER set-based transfer model, calibrated benchmark and DepMap validation"
readme = "README.md"
authors = [
    { name = "Md Kawsar", email = "kawsar35-201@diu.edu.bd" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "fsspec>=2026.9.0",
    "h5py>=3.16.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch==2.13.0",
    "typer>=0.27.2",
]

[project.scripts]
canpert = "canpert.cli:app"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
